<a href="{{ url }}" class="group rounded-2xl bg-white border border-zinc-200 hover:border-brand-300 hover:shadow-xl transition-all p-8 flex flex-col">
    <div class="w-14 h-14 rounded-xl bg-brand-50 group-hover:bg-brand-100 transition-colors flex items-center justify-center mb-6">
        {{ if icon }}
            {{ icon }}<img src="{{ url }}" alt="" class="w-7 h-7">{{ /icon }}
        {{ else }}
            <svg class="w-7 h-7 text-brand-700" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7l9-4 9 4M4 10v8a2 2 0 002 2h12a2 2 0 002-2v-8M9 14h6"/></svg>
        {{ /if }}
    </div>
    <h3 class="text-xl font-bold text-zinc-900 group-hover:text-brand-700 transition-colors">{{ title }}</h3>
    {{ if short_description }}<p class="mt-3 text-zinc-600 leading-relaxed flex-1">{{ short_description }}</p>{{ /if }}
    <span class="mt-6 inline-flex items-center text-brand-700 font-semibold text-sm">
        Ver más
        <svg class="ml-1 w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
    </span>
</a>
