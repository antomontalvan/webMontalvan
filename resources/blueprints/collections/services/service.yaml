title: 'Servicio'
tabs:
  main:
    display: Contenido
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              display: 'Nombre del servicio'
              instructions: 'Ej: Transporte, Depósito Fiscal, Construcciones.'
          -
            handle: short_description
            field:
              type: textarea
              required: true
              character_limit: 200
              display: 'Descripción corta'
              instructions: 'Aparece en las cards de servicios (home, listado). Máximo 200 caracteres.'
          -
            handle: icon
            field:
              type: assets
              container: site
              max_files: 1
              display: 'Ícono'
              instructions: 'Aparece en las cards. SVG o PNG transparente, ~80x80px.'
          -
            handle: hero_section
            field:
              type: section
              display: 'Encabezado de la página interna'
          -
            handle: hero_image
            field:
              type: assets
              container: site
              max_files: 1
              display: 'Imagen de encabezado'
              instructions: 'Imagen grande del fondo del hero. 1920x800px.'
          -
            handle: hero_subtitle
            field:
              type: textarea
              display: 'Bajada del encabezado'
          -
            handle: content_section
            field:
              type: section
              display: 'Contenido extenso'
          -
            handle: content
            field:
              type: bard
              display: 'Descripción detallada'
              save_html: false
              container: site
              link_collections:
                - pages
                - services
              buttons:
                - h2
                - h3
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - quote
                - image
                - table
                - anchor
          -
            handle: highlights_section
            field:
              type: section
              display: 'Características destacadas'
          -
            handle: highlights
            field:
              type: replicator
              display: 'Bullets / Destacados'
              instructions: 'Listado de puntos fuertes (cobertura nacional, seguros, etc).'
              sets:
                main:
                  display: 'Items'
                  sets:
                    item:
                      display: Item
                      fields:
                        -
                          handle: title
                          field:
                            type: text
                            display: Título
                            required: true
                        -
                          handle: description
                          field:
                            type: textarea
                            display: Descripción
                        -
                          handle: icon
                          field:
                            type: assets
                            container: site
                            max_files: 1
                            display: 'Ícono'
          -
            handle: gallery_section
            field:
              type: section
              display: 'Galería'
          -
            handle: gallery
            field:
              type: assets
              container: site
              display: 'Imágenes adicionales'
              instructions: 'Galería opcional al final de la página.'
  sidebar:
    display: Opciones
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              validate: 'required'
              display: 'URL (slug)'
              instructions: 'Aparece en /servicios/{slug}'
          -
            handle: order
            field:
              type: integer
              display: 'Orden'
              instructions: 'Número para ordenar (1, 2, 3...). Menor primero.'
              default: 1
      -
        display: SEO
        fields:
          -
            handle: seo_title
            field:
              type: text
              display: 'Título SEO'
          -
            handle: seo_description
            field:
              type: textarea
              character_limit: 160
              display: 'Descripción SEO'
          -
            handle: seo_image
            field:
              type: assets
              container: site
              max_files: 1
              display: 'Imagen para redes'
