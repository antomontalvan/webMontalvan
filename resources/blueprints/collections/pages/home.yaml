title: 'Home (Inicio)'
tabs:
  hero:
    display: Hero
    sections:
      -
        fields:
          -
            handle: hero_image
            field:
              type: assets
              container: site
              max_files: 1
              required: true
              display: 'Imagen de fondo del hero'
              instructions: 'Imagen grande del fondo. Recomendado 1920x1080px, formato horizontal.'
          -
            handle: hero_title
            field:
              localizable: true
              type: text
              required: true
              display: 'Título principal'
              instructions: 'El título grande que aparece sobre la imagen.'
          -
            handle: hero_subtitle
            field:
              localizable: true
              type: textarea
              display: 'Subtítulo'
              instructions: 'Texto descriptivo debajo del título.'
          -
            handle: hero_cta_label
            field:
              localizable: true
              type: text
              display: 'Texto del botón principal'
              instructions: 'Ej: "Conocenos" o "Pedir cotización".'
          -
            handle: hero_cta_link
            field:
              localizable: true
              type: link
              display: 'Destino del botón'
              instructions: 'Página interna o URL externa.'
              container: site
              collections:
                - pages
                - services
  servicios:
    display: 'Sección Servicios'
    sections:
      -
        fields:
          -
            handle: services_title
            field:
              localizable: true
              type: text
              display: 'Título de la sección'
              default: 'Nuestros servicios'
          -
            handle: services_intro
            field:
              localizable: true
              type: textarea
              display: 'Texto introductorio'
          -
            handle: featured_services
            field:
              type: entries
              collections:
                - services
              display: 'Servicios destacados'
              instructions: 'Elegí qué servicios mostrar en la home y en qué orden. Si no seleccionás nada, se muestran todos.'
              mode: stack
  institucional:
    display: 'Sección Quiénes somos'
    sections:
      -
        fields:
          -
            handle: about_title
            field:
              localizable: true
              type: text
              display: 'Título'
              default: 'Más de 40 años de experiencia'
          -
            handle: about_text
            field:
              localizable: true
              type: bard
              display: Texto
              save_html: true
              buttons:
                - bold
                - italic
                - unorderedlist
          -
            handle: about_image
            field:
              type: assets
              container: site
              max_files: 1
              display: 'Imagen lateral'
          -
            handle: about_cta_label
            field:
              localizable: true
              type: text
              display: 'Texto del botón'
              default: 'Conocer más'
          -
            handle: about_cta_link
            field:
              localizable: true
              type: link
              display: 'Destino del botón'
              container: site
              collections:
                - pages
                - services
  fortalezas:
    display: 'Bandas de Fortalezas'
    sections:
      -
        fields:
          -
            handle: strengths_title
            field:
              localizable: true
              type: text
              display: 'Título de la sección'
              default: 'Por qué elegirnos'
          -
            handle: strengths
            field:
              localizable: true
              type: replicator
              display: Fortalezas
              instructions: 'Agregá tantas como quieras (cobertura nacional, flota propia, depósito fiscal, etc).'
              sets:
                main:
                  display: 'Fortalezas'
                  sets:
                    strength:
                      display: Fortaleza
                      fields:
                        -
                          handle: title
                          field:
                            type: text
                            display: Título
                            required: true
                        -
                          handle: description
                          field:
                            type: textarea
                            display: Descripción
                        -
                          handle: icon
                          field:
                            type: assets
                            container: site
                            max_files: 1
                            display: 'Ícono o imagen'
                            instructions: 'Opcional. SVG o PNG transparente recomendado.'
  cta:
    display: 'CTA Contacto'
    sections:
      -
        fields:
          -
            handle: cta_title
            field:
              localizable: true
              type: text
              display: 'Título del bloque'
              default: '¿Necesitás una cotización?'
          -
            handle: cta_text
            field:
              localizable: true
              type: textarea
              display: 'Texto'
          -
            handle: cta_button_label
            field:
              localizable: true
              type: text
              display: 'Texto del botón'
              default: 'Contactanos'
          -
            handle: cta_button_link
            field:
              localizable: true
              type: link
              display: 'Destino del botón'
              container: site
              collections:
                - pages
  sidebar:
    display: SEO
    sections:
      -
        fields:
          -
            handle: title
            field:
              localizable: true
              type: text
              required: true
              display: 'Título de la página'
          -
            handle: slug
            field:
              type: slug
              read_only: true
              display: 'URL (slug)'
          -
            handle: seo_title
            field:
              localizable: true
              type: text
              display: 'Título SEO'
          -
            handle: seo_description
            field:
              localizable: true
              type: textarea
              character_limit: 160
              display: 'Descripción SEO'
          -
            handle: seo_image
            field:
              type: assets
              container: site
              max_files: 1
              display: 'Imagen para redes'
