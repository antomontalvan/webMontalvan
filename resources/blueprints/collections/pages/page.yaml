title: 'Página'
tabs:
  main:
    display: Contenido
    sections:
      -
        fields:
          -
            handle: title
            field:
              localizable: true
              type: text
              required: true
              validate: 'required'
              display: Título
              instructions: 'El título principal de la página.'
              input_type: text
          -
            handle: hero
            field:
              type: section
              display: Encabezado
          -
            handle: hero_image
            field:
              type: assets
              container: site
              max_files: 1
              display: 'Imagen de encabezado'
              instructions: 'Imagen grande que aparece arriba de la página. Recomendado 1920x800px.'
          -
            handle: hero_title
            field:
              localizable: true
              type: text
              display: 'Título del encabezado'
              instructions: 'Si está vacío se usa el título de la página.'
          -
            handle: hero_subtitle
            field:
              localizable: true
              type: textarea
              display: 'Bajada del encabezado'
              instructions: 'Texto corto debajo del título del encabezado.'
          -
            handle: body
            field:
              type: section
              display: 'Cuerpo'
          -
            handle: content
            field:
              localizable: true
              type: bard
              display: Contenido
              save_html: false
              buttons:
                - h2
                - h3
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - quote
                - anchor
                - image
                - table
              container: site
              link_collections:
                - pages
                - services
              instructions: 'Contenido principal de la página. Podés usar formato, listas, imágenes y enlaces.'
  sidebar:
    display: Opciones
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'required'
              display: 'URL (slug)'
              instructions: 'La parte de la URL para esta página.'
          -
            handle: parent
            field:
              type: entries
              collections:
                - pages
              max_items: 1
              display: 'Página padre'
              instructions: 'Opcional. Si esta página depende de otra (ej: /servicios/transporte).'
      -
        display: SEO
        fields:
          -
            handle: seo_title
            field:
              localizable: true
              type: text
              display: 'Título SEO'
              instructions: 'Título para Google. Si está vacío se usa el título normal.'
          -
            handle: seo_description
            field:
              localizable: true
              type: textarea
              character_limit: 160
              display: 'Descripción SEO'
              instructions: 'Resumen para Google. 150-160 caracteres ideal.'
          -
            handle: seo_image
            field:
              type: assets
              container: site
              max_files: 1
              display: 'Imagen para redes sociales'
              instructions: 'Imagen que aparece al compartir en Facebook, WhatsApp, etc.'
